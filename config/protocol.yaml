experiment_name: safesabr_dashjs_emulation
dashjs_version: 5.2.0
segment_duration_s: 4
session_chunks: 48
bitrate_ladder_kbps: [3000, 8000, 15000, 30000, 60000, 120000]
base_rtt_ms: 40
player_buffer:
  buffer_time_default_s: 8
  buffer_time_at_top_quality_s: 8
  buffer_time_at_top_quality_long_form_s: 8
  buffer_to_keep_s: 4
  buffer_pruning_interval_s: 2
  selection_rule: largest_screened_profile_without_mse_quota_errors
  note: common dash.js infrastructure setting applied to every method
goodput_calibration:
  formula: tc_rate_mbps = trace_rate_mbps + trace_rate_mbps^2 / 1200
  htb_burst_window_ms: 10
  trace_update: change_htb_class_without_replacing_netem
  calibration_chunk_bytes: 60001389
  calibration_targets_mbps: [60, 120, 240]
  measured_goodput_mbps: [58.341, 116.953, 230.837]
calibration:
  split: starlink_windowed_60_15_25/calib
evaluation_set:
  manifest: data/manifests/evaluation_holdout30.csv
  traces_per_region: 10
  total_sessions_per_method: 30
  selection: midpoint_of_10_difficulty_strata_per_region
methods:
  - dash_dynamic
  - robust_mpc
  - sara
  - cmab
  - wabb
  - lumos_mpc
  - starnet_mpc
  - safesabr_selective_rescue
safesabr:
  policy: session_cvar_seed42
  exported_policy_sha256: 0aafb6c46d8be923813cb9b2e8f968c238bd89c24cbe986c08c89959d50c3476
  runtime: risk_aligned
  risk_model: safesabr_risk_critic.json
  risk_threshold: 0.5865331304159999
  monitor_interval_ms: 250
  estimator_window_ms: 1000
  minimum_observation_ms: 500
  buffer_guard_s: 0.5
  restart_rtt_s: 0.1
  maximum_corrections_per_chunk: 1
  severe_risk_budget_s: 10
statistics:
  severe_session_threshold_s: 10
  tail_fraction: 0.05
  confidence_level: 0.95
  bootstrap_samples: 5000
  cluster_unit: trace_window
