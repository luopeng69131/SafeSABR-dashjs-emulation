name: Validate artifact

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify frozen assets
        run: python3 scripts/verify_artifact.py
      - name: Compile Python sources
        run: >-
          python3 -m py_compile
          runner/run_browser.py
          shaper/replay_trace.py
          tools/analyze_emulation_holdout.py
          tools/extract_chunk_sizes.py
          tools/plot_emulation_holdout.py
          tools/run_batch.py
          scripts/verify_artifact.py
      - name: Test browser policy and baseline modules
        run: |
          node tests/check_policy.js app/assets/safesabr_seed42.json
          node tests/check_external_baselines.js
          node tests/check_stateful_runtime.js app/assets/safesabr_seed42.json
